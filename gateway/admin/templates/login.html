<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t('console', lang) }} :: {{ t('login', lang) }}</title>
  <link rel="stylesheet" href="/admin/static/app.css">
</head>
<body class="login-body">
  <div class="login-box">
    <div class="prompt-line"><span class="prompt">root@gateway:~$</span> login</div>
    {% if error %}<p class="error">! {{ t('login_error', lang) }}</p>{% endif %}
    {% if sso_enabled %}
    <a class="sso-btn" href="/admin/auth/login">{{ t('login_sso', lang) }}</a>
    <div class="sep-or">— {{ t('or', lang) }} —</div>
    {% endif %}
    <form method="post" action="/admin/login">
      <label for="api_key">{{ t('login_prompt', lang) }}</label>
      <input type="password" id="api_key" name="api_key" autofocus autocomplete="off">
      <button type="submit">{{ t('submit', lang) }}</button>
    </form>
    <div class="lang small">
      <a href="/admin/setlang?code=zh&next=/admin/login" class="{{ 'on' if lang == 'zh' else '' }}">中文</a>
      <span class="sep">|</span>
      <a href="/admin/setlang?code=en&next=/admin/login" class="{{ 'on' if lang == 'en' else '' }}">EN</a>
    </div>
  </div>
</body>
</html>
