# gateway — persistent ECS deployment.
# Run on the ECS host from this directory:  ./deploy.sh   (or: docker compose up -d)
#
# Image ENV defaults (set in the Dockerfile) already provide:
#   GATEWAY_JOBS_BASE_DIR=/data/gateway_jobs
#   GATEWAY_REGISTRY_PATH=/opt/gateway/services.yaml
#   GATEWAY_SESSION_HEADER_NAME=bioagent-session-id
# so only secrets + OSS/JWT config need to be supplied via .env.
#
# This compose bundles a PostgreSQL 18 service and points the gateway at it by
# default (the URL is auto-composed from the POSTGRES_* vars in .env). To use an
# external/managed DB instead, set GATEWAY_DB_URL in .env — it overrides the
# bundled URL. The gateway entrypoint runs `alembic upgrade head` against
# whichever DB GATEWAY_DB_URL names, after postgres reports healthy.
services:
  postgres:
    image: postgres:18.4-trixie
    container_name: gateway-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bioagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gateway}
    volumes:
      # Host bind under deploy/ (like the job scratch) so the DB files are
      # visible/backup-able alongside the deployment. PG 18+ stores data in a
      # major-version subdir, so mount the parent /var/lib/postgresql — NOT
      # .../data (see docker-library/postgres#1259). The image chowns the data
      # subdir to the postgres uid on first init.
      - ${GATEWAY_PG_DATA_DIR:-./pgdata}:/var/lib/postgresql
    # Not published by default — the gateway reaches it over the compose network
    # as host "postgres". Uncomment to expose for debugging (psql from the host).
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bioagent} -d ${POSTGRES_DB:-gateway}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    image: ${GATEWAY_IMAGE:-gateway:latest}
    container_name: gateway
    restart: always
    # Wait until postgres accepts connections so the entrypoint's
    # `alembic upgrade head` doesn't race the DB coming up.
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-9000}:9000"
    # Layered config: non-secret topology (checked in) then secrets (.env, wins).
    env_file:
      - ../config/gateway.common.env
      - ../config/gateway.ecs.env
      - .env
    environment:
      # Point the gateway at the bundled postgres by default; setting
      # GATEWAY_DB_URL in .env (cloud RDS URL, or sqlite for single-node)
      # overrides this composed value.
      GATEWAY_DB_URL: ${GATEWAY_DB_URL:-postgresql+psycopg://${POSTGRES_USER:-bioagent}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gateway}}
    volumes:
      # Persistent job scratch (/data/gateway_jobs). The SQLite DB dir
      # (/data/gateway) is unused while GATEWAY_DB_URL points at postgres.
      - ${GATEWAY_DATA_DIR:-./data}:/data
      # Downstream service registry — bind-mounted from the repo's canonical
      # services.yaml (single source of truth) so adding/updating a service only
      # needs an edit + `docker compose restart gateway`, NOT an image rebuild.
      # The Dockerfile still bakes a copy as a standalone fallback; this mount
      # overrides it. The registry loads at startup, so restart to apply. Set
      # GATEWAY_REGISTRY_FILE if the repo isn't checked out at ../../services.yaml.
      - ${GATEWAY_REGISTRY_FILE:-../../services.yaml}:/opt/gateway/services.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/healthz')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Bundled OIDC IdP (Keycloak) — OPTIONAL, gated by the "idp" compose profile so
  # an internal deployment gets a working IdP with no external SSO to stand up.
  # Enable by setting COMPOSE_PROFILES=idp in .env; to front a managed/corp IdP
  # instead, leave the profile unset and point GATEWAY_AUTH__* at it in .env.
  #
  # !!! The imported realm (deploy/openfaas/keycloak-realm.json) ships THROWAWAY
  # DEV credentials — admin/admin, client secret bioq-gateway-secret — and only
  # whitelists localhost:9000 admin-console redirect URIs. Fine for an internal /
  # staging box; HARDEN before real production (rotate the admin password + client
  # secret, switch to `start` + a real DB + TLS, restrict redirect URIs). See the
  # .env.example bundled-IdP notes.
  keycloak:
    image: ${KC_IMAGE:-quay.io/keycloak/keycloak:26.0}
    container_name: gateway-keycloak
    profiles: ["idp"]
    restart: always
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      # Frontend issuer that clients (browser + bioq) see and that lands in the
      # token `iss`. MUST be reachable by them — set KC_HOSTNAME to this host's URL
      # in .env (e.g. http://10.0.0.5:8081); localhost only works via a tunnel.
      # BACKCHANNEL_DYNAMIC lets the gateway's in-network JWKS fetch still resolve.
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:${KC_PORT:-8081}}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "${KC_PORT:-8081}:8080"
    volumes:
      # `:z` relabels for SELinux hosts (Fedora/RHEL); harmless elsewhere.
      - ../openfaas/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro,z
      - kcdata:/opt/keycloak/data

volumes:
  kcdata:   # bundled keycloak H2 (realm + users persist across restarts)
