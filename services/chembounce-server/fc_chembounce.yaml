        port: 9000
        healthCheckConfig: {}
      memorySize: 8192
      environmentVariables:
        CHEMBOUNCE_SESSION_HEADER_NAME: bioagent-session-id
      triggers:
        - triggerConfig:
            methods:
              - GET
              - POST
              - PUT
              - DELETE
            authType: anonymous
            disableURLInternet: true
          triggerName: trigger-e0eff7g5
          description: ''
          qualifier: LATEST
          triggerType: http
      asyncInvokeConfig:
        asyncTask: true
        maxAsyncEventAgeInSeconds: 86400
        destinationConfig:
          onFailure:
            destination: ''
          onSuccess:
            destination: ''
        maxAsyncRetryAttempts: 3
