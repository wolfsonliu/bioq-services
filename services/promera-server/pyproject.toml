[project]
name = "promera-server"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "bioq-service-framework[mcp]",
    "httpx",
    "alibabacloud-oss-v2",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.uv.sources]
bioq-service-framework = { path = "../_framework", editable = true }

[tool.uv]
package = false
