[project]
name = "proteinmpnn-server"
version = "0.0.1"
description = "FastAPI wrapper for ProteinMPNN sequence design / scoring / probability endpoints."
requires-python = ">=3.10"
dependencies = [
    "bioagent-service-framework[mcp]",
    "httpx>=0.27",
    "alibabacloud-oss-v2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server"]
package-dir = {"server" = "."}
