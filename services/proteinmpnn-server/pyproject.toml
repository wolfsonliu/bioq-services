[project]
name = "proteinmpnn-server"
version = "0.0.1"
description = "FastAPI wrapper for ProteinMPNN sequence design / scoring / probability endpoints."
requires-python = ">=3.10"
dependencies = [
    "bioq-service-framework[mcp]",
    "httpx>=0.27",
    "alibabacloud-oss-v2",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

# Test/dev env only — the `server` package is set up by tests/conftest.py (importlib),
# so uv should not build/install this service. Heavy runtime deps live in the Dockerfile.
[tool.uv]
package = false

[tool.uv.sources]
bioq-service-framework = { path = "../../framework", editable = true }
