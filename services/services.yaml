# Deployed service registry — the single source of truth for downstream
# service URLs and deployment metadata. Loaded by
# bioagent_service.service_registry (load_services / fc_url) and the gateway.
#
# Schema per entry (only `url` is required):
#   url:      VPC HTTP trigger URL (https://fc-...-vpc.fcapp.run)
#   region:   Aliyun region (default cn-hangzhou)
#   tier:     hot | warm | cold — deployment tier (default warm)
#             hot  = keep warm / provisioned (frequent, latency-sensitive)
#             warm = FC scale-to-zero (default for most services)
#             cold = batch-only / rarely called
#   function: FC function name (from the Aliyun FC console) — used by the
#             gateway for FC OpenAPI GetAsyncTask status polling. Leave unset
#             until known; the gateway falls back to HTTP status for those.
#   gpu:      GPU card class (e.g. fc.gpu.tesla.1) — OPTIONAL.
#
# Keep this file in sync with the FC console after each (re)deploy.
services:
  alphafold-server:
    url: https://fc-alphafold-fcizetpnjc.cn-hangzhou-vpc.fcapp.run
    tier: warm
    function: fc_alphafold
