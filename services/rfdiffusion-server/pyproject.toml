[project]
name = "rfdiffusion-server"
version = "0.1.0"
description = "HTTP service wrapping RFdiffusion (Rosetta Commons) for FC GPU deployment"
requires-python = ">=3.10"
dependencies = [
    "bioq-service-framework[mcp]",
    "httpx>=0.27",
    "alibabacloud-oss-v2>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.uv.sources]
bioq-service-framework = { path = "../_framework", editable = true }

[tool.uv]
package = false
