[project]
name = "bindcraft2-server"
version = "0.0.1"
description = "HTTP service wrapping BindCraft2 protein binder design campaigns for FC GPU deployment"
requires-python = ">=3.10"
dependencies = [
    "bioq-service-framework[mcp]",
    "httpx>=0.27",
    "alibabacloud-oss-v2>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# N999：`<svc>-server` 目录名含连字符，不是合法 Python 模块名——仓库里每个
# 服务都是这个命名（镜像内以 `server` 导入），属对目录名的固有误报。
ignore = ["N999"]

[tool.ruff.lint.isort]
# conftest 用 importlib 把服务目录按 `server` 别名挂进 sys.modules；ruff 静态
# 分析看不到该别名，会把 `server.*` 误判成第三方包而要求重排 import。
known-first-party = ["server"]

[tool.ruff.lint.per-file-ignores]
# conftest 里的 `# noqa: E402` 是仓库既有写法（ruff ≤0.15 默认启用 E402 组）；
# ruff 0.16 起 E402 移出默认集合，该 noqa 被 RUF100 判为"未使用"。保留它，
# 使服务在旧版 ruff 下语义不变。
"tests/conftest.py" = ["RUF100"]

[tool.uv.sources]
bioq-service-framework = { path = "../../framework", editable = true }

[tool.uv]
package = false
