[project]
name = "gateway-server"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "bioagent-service-framework[mcp]",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.8",
    "sqlalchemy>=2.0",
    "alibabacloud-oss-v2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server"]
package-dir = {"server" = "."}
