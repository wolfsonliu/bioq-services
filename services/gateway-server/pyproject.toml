[project]
name = "gateway-server"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "bioq-service-framework[mcp]",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.8",
    "sqlalchemy>=2.0",
    "alembic>=1.13",          # schema migrations (alembic upgrade head on deploy)
    "psycopg[binary]>=3.1",   # driver for postgresql+psycopg:// (cloud RDS); sqlite needs no driver
    "alibabacloud-oss-v2",
    "alibabacloud_fc20230330>=4.0",
    "alibabacloud_tea_openapi>=0.3.0",
    "alibabacloud_tea_util",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
bioq-service-framework = { path = "../_framework", editable = true }

[tool.setuptools]
packages = ["server"]
package-dir = {"server" = "."}
