[project]
name = "dockq-server"
version = "0.0.1"
description = "FastAPI wrapper for DockQ — protein/NA/small-molecule docking quality scoring (single + batch)."
requires-python = ">=3.10"
dependencies = [
    "bioagent-service-framework[mcp]",
    "httpx>=0.27",
    "alibabacloud-oss-v2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server"]
package-dir = {"server" = "."}
