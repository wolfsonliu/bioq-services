[project]
name = "rfdiffusion2-server"
version = "0.0.1"
description = "HTTP service wrapping RFdiffusion2 (Ahern et al. 2025) for FC GPU deployment"
requires-python = ">=3.11"
dependencies = [
    "bioq-service-framework[mcp]",
    "httpx>=0.27",
    "alibabacloud-oss-v2>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
