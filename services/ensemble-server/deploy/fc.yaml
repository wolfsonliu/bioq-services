edition: 3.0.0
name: fc3-example
access: default
resources:
  fcDemo:
    component: fc3
    props:
      region: cn-hangzhou
      handler: index.handler
      imagePrewarmStatus: InProgress
      diskSize: 10240
      runtime: custom-container
      cpu: 8
      instanceConcurrency: 20
      vpcConfig:
        securityGroupId: sg-bp16eiz6pkbsj4suejie
        anytunnelViaENI: false
        vpcId: vpc-bp1y6pbb5wp095bxej4np
        vSwitchIds:
          - vsw-bp10yskvjvewq3ndyl4tv
      role: ''
      disableOndemand: false
      nasConfig:
        groupId: 0
        mountPoints:
          - enableTLS: false
            serverAddr: 0620a487b6-gum23.cn-hangzhou.nas.aliyuncs.com:/fc
            mountDir: /data
        userId: 0
      description: ''
      timeout: 36000
      internetAccess: true
      resourceGroupId: rg-acfm2onshbsoxxy
      instanceIsolationMode: SHARE
      logConfig:
        enableRequestMetrics: true
        enableInstanceMetrics: true
        logBeginRule: DefaultRegex
        project: serverless-cn-hangzhou-19ebd24e-ebe2-5da6-bf89-3c78e2ce4d70
        logstore: default-logs
      functionName: fc_ensemble
      sessionAffinity: NONE
      gpuConfig:
        gpuMemorySize: 16384
        gpuType: fc.gpu.tesla.1
      customContainerConfig:
        image: harbor.ruosheng.bio/aliyun_fc/ensemble-server:v0.0.12
        port: 9000
        healthCheckConfig: {}
      memorySize: 8192
      environmentVariables:
        ENSEMBLE_FC_METHODS__ALPHAFOLD__HTTP_BASE_URL: https://fc-alphafold-fcizetpnjc.cn-hangzhou-vpc.fcapp.run
        ENSEMBLE_FC_METHODS__ALPHAFOLD__FUNCTION: alphafold-server
        ENSEMBLE_FC_METHODS__BOLTZ__TASK_ENDPOINT: /api/tasks/predict_structure
        ENSEMBLE_FC_METHODS__PROMERA__HTTP_BASE_URL: https://fc-promera-adkrlhmlcq.cn-hangzhou-vpc.fcapp.run
        ENSEMBLE_FC_METHODS__ALPHAFOLD__TASK_ENDPOINT: /api/tasks/fold
        ENSEMBLE_FC_METHODS__BOLTZ__HTTP_BASE_URL: https://fc-boltz-kbioniejif.cn-hangzhou-vpc.fcapp.run
        ENSEMBLE_FC_METHODS__PROMERA__TASK_ENDPOINT: /api/tasks/cofold
        ENSEMBLE_FC_METHODS__BOLTZ__FUNCTION: boltz-server
        ENSEMBLE_FC_METHODS__ESMFOLD2__FUNCTION: esmfold2-server
        ENSEMBLE_FC_METHODS__ESMFOLD2__TASK_ENDPOINT: /api/tasks/fold
        ENSEMBLE_FC_METHODS__ESMFOLD2__HTTP_BASE_URL: https://fc-esmfold-spayusioug.cn-hangzhou-vpc.fcapp.run
        ENSEMBLE_FC_METHODS__PROMERA__FUNCTION: promera-server
      triggers:
        - triggerConfig:
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - HEAD
              - OPTIONS
              - PATCH
            authType: anonymous
            disableURLInternet: true
          triggerName: defaultTrigger
          description: ''
          qualifier: LATEST
          triggerType: http
