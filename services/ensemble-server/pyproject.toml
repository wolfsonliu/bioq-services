[project]
name = "ensemble-server"
version = "0.0.1"
description = "Multi-method biomolecular task aggregator (folding/design/scoring ensemble)"
requires-python = ">=3.10"
dependencies = [
    "bioq-service-framework",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.8",
    "alibabacloud_fc20230330>=4.0",
    "alibabacloud_tea_openapi>=0.3",
    "alibabacloud_tea_util>=0.3",
]

[tool.uv.sources]
bioq-service-framework = { path = "../../framework", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
