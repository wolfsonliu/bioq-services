[project]
name = "mmseqs2-server"
version = "0.0.1"
description = "FastAPI wrapper for MMseqs2 GPU search exposing the ColabFold MSA HTTP protocol."
requires-python = ">=3.11"
dependencies = [
    "bioq-service-framework",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.28",
    "python-multipart",
]

[tool.uv.sources]
bioq-service-framework = { path = "../_framework", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
